name: tool-eval
permissions: {}

concurrency:
  group: tool-eval-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'scripts/**'
      - '.github/workflows/**'

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTFLAGS: "-D warnings"

# Set default shell
defaults:
  run:
    shell: bash

jobs:
  eval:
    runs-on: ubuntu-latest
    # Cold workspace builds and PTY test compilation need this finite budget.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install ripgrep (for grep_search)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Set up Rust with the compiler cache
        uses: leynos/shared-actions/.github/actions/setup-rust@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          rustflags: ""

      - name: Build
        run: cargo build --locked --workspace --quiet

      - name: Run tool smoke harness
        run: |
          set -euo pipefail
          bash scripts/test_tools_e2e.sh | tee tool-eval.log
          bash scripts/test_pty_tools.sh | tee -a tool-eval.log

      - name: Upload eval artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tool-eval-artifacts
          path: |
            tool-eval.log
            tool-eval.json
