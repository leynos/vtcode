name: "Secret Scan"

# Scans for hardcoded credentials using gitleaks (config: .gitleaks.toml).
# - On push/PR: scans the checked-out working tree (fast, blocks new leaks).
# - Weekly + manual: scans full git history (surfaces any historical leak).
# See docs/guides/security.md "Secret Scanning" for allowlist rationale.

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC audit
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # Pinned for reproducibility; bump deliberately and re-run the local check:
  #   gitleaks detect --source . --no-git --config .gitleaks.toml --verbose
  GITLEAKS_VERSION: "8.30.1"

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history for the scheduled historical scan.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Routine gate: any secret currently in the repo fails the build.
      - name: Scan working tree (push / pull_request)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --verbose

      - name: Scan first-party debt markers
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: ./scripts/first-party-debt-scan.sh

      # Non-blocking historical audit: surfaces secrets introduced in past
      # commits so they can be rotated without failing routine PRs.
      - name: Scan full history (schedule / workflow_dispatch)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: gitleaks git --config .gitleaks.toml --redact --verbose
