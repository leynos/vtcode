---
name: "CI Pipeline"
permissions: {}

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"
  push:
    branches:
      - main
    paths:
      - "**.rs"
      - "**.toml"
      - "**.lock"
      - "**.yml"
      - "**.yaml"
      - "**.json"
      - "**.js"
      - "**.ts"
      - "**.md"  # Still run on markdown changes since we have markdown linting
      - "Makefile"
      - "scripts/**"
      - "!.github/dependabot.yml"  # Exclude dependabot changes
      - "!.gitignore"
      - "!.vtcodegitignore"
      - "!.env*"
  pull_request:
    branches:
      - main
    paths:
      - "**.rs"
      - "**.toml"
      - "**.lock"
      - "**.yml"
      - "**.yaml"
      - "**.json"
      - "**.js"
      - "**.ts"
      - "**.md"  # Still run on markdown changes since we have markdown linting
      - "Makefile"
      - "scripts/**"
      - "!.github/dependabot.yml"  # Exclude dependabot changes
      - "!.gitignore"
      - "!.vtcodegitignore"
      - "!.env*"

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTFLAGS: "-D warnings"

# Set default shell and working directory
defaults:
  run:
    shell: bash

# ensure that the workflow is only triggered once per PR,  subsequent pushes to the PR will cancel
# and restart the workflow. See https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Make obvious and fast tests to run first, to catch issues as early as possible
jobs:
  workflow-security:
    name: Workflow Security Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Enforce workflow security invariants
        run: bash scripts/check_workflow_security.sh

  large-files:
    name: Check Custom Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check tracked file sizes
        run: python3 scripts/check_large_files.py 400000
      - name: Check markdown documentation location
        run: python3 scripts/check_markdown_location.py
      - name: Check core docs link integrity
        run: python3 scripts/check_docs_links.py

  zen-governance:
    name: Zen Governance (Warn)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Rust file length baseline
        run: python3 scripts/check_rust_file_length.py --mode warn --max-lines 500
      - name: unwrap/expect baseline
        run: python3 scripts/check_no_unwrap_expect_prod.py --mode warn --allowlist scripts/zen_allowlist.txt
      - name: allowlist hygiene baseline
        run: python3 scripts/check_zen_allowlist.py --mode warn --allowlist scripts/zen_allowlist.txt

  unwrap-expect-enforcement:
    name: Unwrap/Expect Enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Enforce production unwrap/expect policy
        run: python3 scripts/check_no_unwrap_expect_prod.py --mode enforce --allowlist scripts/zen_allowlist.txt

  # Lint the formatting of the codebase.
  formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Check for typos in the codebase.
  # See <https://github.com/crate-ci/typos/>
  # lint-typos:
  #   name: Check Typos
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: crate-ci/typos@master

  # Check for any disallowed dependencies in the codebase due to license / security issues.
  # See <https://github.com/EmbarkStudios/cargo-deny>
  # dependencies:
  #   name: Check Dependencies
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: EmbarkStudios/cargo-deny-action@v2

  # Verify THIRD-PARTY-NOTICES is in sync with Cargo.lock.
  # See <https://github.com/EmbarkStudios/cargo-about>
  license-notices:
    name: Check License Notices
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: taiki-e/install-action@fae525311e5e299134b606bf247d465dd0df8190  # v2
        with:
          # Pin cargo-about so CI-generated output matches local generation.
          tool: cargo-about@0.9.1
      - name: Check THIRD-PARTY-NOTICES is up to date
        run: scripts/generate-notices.sh --check

  # Run cargo clippy.
  lint-clippy:
    name: Check Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "20G"
      RUSTC_WRAPPER: "sccache"
      CARGO_TERM_VERBOSE: false
      CARGO_TERM_COLOR: always
      YAMLLINT_VERSION: '1.38.0'
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_TOOL_DIR: ${{ github.workspace }}/.uv-tools
      UV_TOOL_BIN_DIR: ${{ github.workspace }}/.uv-bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: 'false'
      - name: Cache yamllint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .uv-cache
            .uv-tools
            .uv-bin
          key: yamllint-${{ runner.os }}-${{ runner.arch }}-${{ env.YAMLLINT_VERSION }}
      - name: Install yamllint
        run: |
          uv tool install "yamllint==${YAMLLINT_VERSION}"
          echo "${UV_TOOL_BIN_DIR}" >> "$GITHUB_PATH"
      - name: Cache actionlint
        id: cache_actionlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: actionlint
          key: actionlint-${{ runner.os }}-${{ runner.arch }}-1.7.12
      - name: Download actionlint
        if: steps.cache_actionlint.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          readonly ACTIONLINT_VERSION='1.7.12'
          readonly ACTIONLINT_SHA256='8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          readonly ACTIONLINT_INSTALLER_COMMIT='914e7df21a07ef503a81201c76d2b11c789d3fca'
          readonly ACTIONLINT_ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          readonly ACTIONLINT_RAW_BASE='https://raw.githubusercontent.com/rhysd/actionlint'
          readonly ACTIONLINT_SCRIPT='scripts/download-actionlint.bash'
          readonly ACTIONLINT_INSTALLER_URL="${ACTIONLINT_RAW_BASE}/${ACTIONLINT_INSTALLER_COMMIT}/${ACTIONLINT_SCRIPT}"
          readonly ACTIONLINT_RELEASE_ROOT='https://github.com/rhysd/actionlint/releases/download'
          readonly ACTIONLINT_RELEASE_BASE="${ACTIONLINT_RELEASE_ROOT}/v${ACTIONLINT_VERSION}"
          readonly ACTIONLINT_RELEASE_URL="${ACTIONLINT_RELEASE_BASE}/${ACTIONLINT_ARCHIVE}"
          ACTIONLINT_INSTALLER_PATH="$(mktemp)"
          ACTIONLINT_ARCHIVE_PATH="$(mktemp)"
          trap 'rm -f "${ACTIONLINT_INSTALLER_PATH}" "${ACTIONLINT_ARCHIVE_PATH}"' EXIT
          # Feed the verified archive to the reviewed installer without a second download.
          curl() {
            if [[ "${*: -1}" == "${ACTIONLINT_RELEASE_URL}" ]]; then
              cat "${ACTIONLINT_ARCHIVE_PATH}"
            else
              command curl "$@"
            fi
          }
          export ACTIONLINT_RELEASE_URL ACTIONLINT_ARCHIVE_PATH
          export -f curl
          command curl --fail --location --show-error --output "${ACTIONLINT_INSTALLER_PATH}" \
            "${ACTIONLINT_INSTALLER_URL}"
          command curl --fail --location --show-error --output "${ACTIONLINT_ARCHIVE_PATH}" \
            "${ACTIONLINT_RELEASE_URL}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${ACTIONLINT_ARCHIVE_PATH}" | sha256sum --check --
          bash "${ACTIONLINT_INSTALLER_PATH}" "${ACTIONLINT_VERSION}"
      - name: Lint
        run: /usr/bin/make BUILD_JOBS="--jobs 4" ACTIONLINT="$GITHUB_WORKSPACE/actionlint" lint
      - name: Validate GitHub Actions lint contract
        run: /usr/bin/make test-github-actions-validation

  # Check for unmaintained dependencies.
  # See docs/guides/cargo-unmaintained.md for more information.
  unmaintained:
    name: Check Unmaintained Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
      - name: Install cargo-unmaintained
        uses: taiki-e/install-action@fae525311e5e299134b606bf247d465dd0df8190  # v2
        with:
          tool: cargo-unmaintained@1.10.0
      - name: Check for unmaintained dependencies
        run: cargo unmaintained --no-warnings

  dependency-audit:
    name: Check RustSec Advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@fae525311e5e299134b606bf247d465dd0df8190  # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit locked dependencies against RustSec
        run: cargo audit --file Cargo.lock

  # Run markdownlint on all markdown files in the repository.
  lint-markdown:
    name: Check Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        with:
          filters: |
            markdown:
              - '**/*.md'
              - '!.github/workflows/*.yml'
              - '!target/**'
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        if: steps.filter.outputs.markdown == 'true'
        with:
          globs: |
            '**/*.md'
            '!target'

  check-cross-platform:
    name: Cross-platform check ${{ matrix.os }}
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        toolchain: ["stable"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "20G"
      RUSTC_WRAPPER: "sccache"
      CARGO_TERM_VERBOSE: false
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      - run: cargo check --locked --jobs 4

  check-windows:
    name: Check Windows (warm cache)
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_TERM_VERBOSE: false
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          key: x86_64-pc-windows-msvc
      - name: Check Windows workspace (deny warnings)
        shell: bash
        run: cargo check --locked --target x86_64-pc-windows-msvc --workspace --all-targets --jobs 4
      - name: Clippy Windows workspace (deny warnings)
        shell: bash
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --workspace --all-targets --jobs 4 -- -D warnings

  test:
    name: "Cargo nextest"
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "20G"
      RUSTC_WRAPPER: "sccache"
      CARGO_TERM_VERBOSE: false
      CARGO_TERM_COLOR: always
    steps:
      - name: "Check out the repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: "dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8"  # stable
        with:
          toolchain: "stable"

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fae525311e5e299134b606bf247d465dd0df8190  # nextest

      - name: Run tests
        run: cargo nextest run --locked --profile ci --cargo-profile ci

      - name: Run focused harness PTY/TUI regressions
        if: success() || failure()
        run: |
          cargo test --locked -p vtcode-core --test pty_tests
          cargo test --locked -p vtcode-bash-runner --test pipe_tests
          cargo test --locked -p vtcode --bin vtcode inline_events::tests

  msrv:
    name: MSRV Check (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_TERM_VERBOSE: false
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae  # nightly
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
      - run: cargo check --locked --jobs 4

  nightly:
    name: Nightly Smoke Test
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    env:
      CARGO_TERM_VERBOSE: false
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae  # nightly
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
      - run: cargo check --locked --jobs 4

