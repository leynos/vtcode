name: "arli-replay"
matcher: "^/v1/chat/completions$"
priority: 100
response_template: "arli/response.json.j2"
error_template: "arli/error.json.j2"
status_code: "200"
stream:
  enabled: true
  lifecycle:
    on_start: { template_path: "arli/captured_stream.j2" }
    on_chunk: { template_body: "" }
    on_stop: { template_body: "" }
