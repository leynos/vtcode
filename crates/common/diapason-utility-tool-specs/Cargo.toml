[package]
name = "diapason-utility-tool-specs"
version.workspace = true
edition = "2024"
rust-version = "1.93.0"
authors = ["Vinh Nguyen <vinhnguyen2308@gmail.com>", "df12 Productions"]
description = "Passive JSON schemas for Diapason utility, file, scheduling, and collaboration tool surfaces"
license.workspace = true
readme = "README.md"
homepage = "https://github.com/leynos/vtcode"
repository = "https://github.com/leynos/vtcode"
documentation = "https://docs.rs/diapason-utility-tool-specs"
keywords = ["schemas", "tools", "file", "json", "diapason"]
categories = ["development-tools", "data-structures"]
publish = true

[features]
default = []
mcp = ["dep:rmcp"]

[dependencies]
rmcp = { version = "=3.9.0", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[lib]
doctest = false
