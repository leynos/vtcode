[package]
name = "diapason-indexer"
version.workspace = true
edition = "2024"
rust-version = "1.93.0"
authors = ["Vinh Nguyen <vinhnguyen2308@gmail.com>", "df12 Productions"]
description = "Workspace file indexer, fuzzy search, and markdown-backed storage for Diapason"
license.workspace = true
readme = "README.md"
homepage = "https://github.com/leynos/vtcode"
repository = "https://github.com/leynos/vtcode"
documentation = "https://docs.rs/diapason-indexer"
categories = ["development-tools", "parsing", "command-line-interface"]
keywords = ["vt", "tui", "indexer", "agent", "coding-agent"]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
rustdoc-args = ["--cfg", "docsrs"]


[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
fs2 = { workspace = true }
hashbrown = { workspace = true }
ignore = { workspace = true }
indexmap = { workspace = true }
nucleo-matcher = "0.3"
parking_lot = "0.12.5"
rayon = "1"
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
diapason-commons = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true
