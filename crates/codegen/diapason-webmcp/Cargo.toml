[package]
name = "diapason-webmcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Vinh Nguyen <vinhnguyen2308@gmail.com>", "df12 Productions"]
description = "Authenticated WebMCP bridge and workspace adapter for Diapason"
license.workspace = true
readme = "README.md"
homepage = "https://github.com/leynos/vtcode"
repository = "https://github.com/leynos/vtcode"
documentation = "https://docs.rs/diapason-webmcp"
keywords = ["diapason", "webmcp", "websocket", "workspace", "security"]
categories = ["development-tools", "web-programming"]

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws"] }
futures = { workspace = true }
hashbrown = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
rmcp = { version = "=3.1.4", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shell-words = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
diapason-commons = { workspace = true }
diapason-exec-events = { workspace = true }
diapason-safety = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
temp-env = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[lints]
workspace = true
