[package]
name = "diapason-acp"
version.workspace = true
edition = "2024"
rust-version = "1.93.0"
authors = ["Vinh Nguyen <vinhnguyen2308@gmail.com>", "df12 Productions"]
description = "ACP bridge and client implementation for Diapason"
license.workspace = true
readme = "README.md"
homepage = "https://github.com/leynos/vtcode"
repository = "https://github.com/leynos/vtcode"
documentation = "https://docs.rs/diapason-acp"
keywords = ["diapason", "acp", "zed", "agent", "bridge"]
categories = ["api-bindings", "development-tools", "text-editors"]

[dependencies]
dirs.workspace = true
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hashbrown = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
url = { workspace = true }
percent-encoding = "2.3"
diapason-core = { workspace = true }
diapason-config = { workspace = true }
diapason-commons = { workspace = true }
diapason-safety = { workspace = true }

[dev-dependencies]
assert_fs = { workspace = true }
insta = { version = "1.39", features = ["json"] }
proptest = "1.11"
rstest = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
diapason-llm = { workspace = true }
wiremock = "0.6.5"

[lib]
doctest = false

[lints]
workspace = true
